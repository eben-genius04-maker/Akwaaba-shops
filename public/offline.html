<!doctype html>
<html lang="en-GH">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>You're offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#faf7f2;color:#1b1814;text-align:center;padding:24px}
  @media (prefers-color-scheme:dark){body{background:#12100d;color:#f3eee7}p{color:#a89e91!important}}
  img{width:64px;height:64px;border-radius:14px}
  h1{font-size:22px;margin:16px 0 6px}p{color:#6d645a;margin:0 0 20px}
  button{background:#0b6e4f;color:#fff;border:0;border-radius:999px;padding:12px 22px;font-size:15px;cursor:pointer}
</style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Check your data or Wi-Fi, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
